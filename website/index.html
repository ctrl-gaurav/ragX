<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b10" />
    <title>ragX · Agentic retrieval at scale</title>
    <meta
      name="description"
      content="ragX is an open-source agentic retrieval framework. An agent ranks and reads passages, a chain of sub-questions names the evidence a question leaves unnamed, and one call answers with exact citations. +8.1 F1 over the strongest single-shot baseline on all of Wikipedia."
    />
    <meta property="og:title" content="ragX · Agentic retrieval at scale" />
    <meta
      property="og:description"
      content="Find the evidence your question does not name. Open source, training-free, pip install pyragx."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem("ragx-theme");
          var prefersLight =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          var light = saved ? saved === "light" : prefersLight;
          var el = document.documentElement;
          el.classList.toggle("light", light);
          el.classList.toggle("dark", !light);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
