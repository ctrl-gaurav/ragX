<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ragX: agentic retrieval at scale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a0d13"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 40) scale(420 300)">
      <stop stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 360) scale(460 320)">
      <stop stop-color="#c084fc" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#g1)"/>
  <rect width="1280" height="400" rx="24" fill="url(#g2)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="23.5" stroke="#ffffff" stroke-opacity="0.08"/>

  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="72" y="136" font-size="100" font-weight="900" letter-spacing="-4" fill="#f8fafc">rag<tspan fill="url(#acc)" filter="url(#glow)">X</tspan></text>
    <text x="76" y="214" font-size="38" font-weight="800" letter-spacing="-1" fill="#f1f5f9">Agentic retrieval at scale.</text>
    <text x="76" y="256" font-size="19" fill="#94a3b8">Find the evidence your question does not name — and answer with exact citations.</text>

    <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="16">
      <rect x="76" y="290" width="236" height="44" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="96" y="318" fill="#34d399">$</text>
      <text x="116" y="318" fill="#e2e8f0">pip install pyragx</text>
    </g>
  </g>

  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
    <g transform="translate(830 74)">
      <rect width="378" height="76" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="22" y="46" font-size="34" font-weight="900" fill="url(#acc)">+8.1 F1</text>
      <text x="176" y="34" font-size="14" fill="#e2e8f0" font-weight="600">over the strongest</text>
      <text x="176" y="54" font-size="14" fill="#94a3b8">single-shot baseline, 21M</text>
    </g>
    <g transform="translate(830 162)">
      <rect width="378" height="76" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="22" y="46" font-size="34" font-weight="900" fill="url(#acc)">22×</text>
      <text x="176" y="34" font-size="14" fill="#e2e8f0" font-weight="600">fewer prompt tokens</text>
      <text x="176" y="54" font-size="14" fill="#94a3b8">than DCI-Agent-Lite</text>
    </g>
    <g transform="translate(830 250)">
      <rect width="378" height="76" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="22" y="46" font-size="34" font-weight="900" fill="url(#acc)">27</text>
      <text x="176" y="34" font-size="14" fill="#e2e8f0" font-weight="600">models benchmarked</text>
      <text x="176" y="54" font-size="14" fill="#94a3b8">on five QA datasets</text>
    </g>
  </g>
</svg>
